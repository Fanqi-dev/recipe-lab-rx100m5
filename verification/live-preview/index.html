<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe Lab · 开发预览</title>
<style>
:root{color-scheme:dark;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:#eee;background:#191919;--blue:#46a9df;--green:#45b8b2;--orange:#f28a5b}
*{box-sizing:border-box}body{margin:0;padding:22px;max-width:1000px;margin-inline:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:18px;font-weight:500;margin:0}p{margin:7px 0 16px;color:#aaa;font-size:12px}button,select{font:inherit;color:inherit;background:#2a2a2a;border:1px solid #4c4c4c;border-radius:3px;padding:7px 12px;min-height:36px}button{cursor:pointer}button:hover{background:#353535}button:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button[aria-pressed=true]{border-color:var(--blue);background:#334450}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.screen{position:relative;width:min(100%,720px);margin:auto;background:#0b0b0b;border:1px solid #444}.screen img{width:100%;height:auto;aspect-ratio:4/3;display:block}.screen .busy{position:absolute;inset:0;background:#191919d9;display:grid;place-items:center;color:var(--orange)}.screen .busy[hidden]{display:none}.keys{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin:16px auto;max-width:720px}.pad{display:grid;grid-template-columns:repeat(3,48px);gap:5px}.pad button{padding:7px}.empty{visibility:hidden}.side{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:350px}.side button{font-size:12px}.lower{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:#aaa;font-size:12px}.lower label{display:flex;align-items:center;gap:8px}.lower select{font-size:12px;padding:5px}#error{white-space:pre-wrap;color:var(--orange);font-size:12px;max-height:160px;overflow:auto}.notice{border-top:1px solid #333;padding-top:12px;margin-top:14px}#state{color:var(--green)}@media(max-width:480px){body{padding:12px}.keys{gap:12px}nav button{padding:6px 10px}}
</style></head><body>
<header><h1>Recipe Lab <span style="color:#aaa;font-size:12px">开发预览</span></h1><span id="build" role="status">正在编译…</span></header>
<p>Java 绘制界面同源 · 按键流程部分模拟 · 灰色区域是画面占位，不代表照片清晰度或滤镜效果</p>
<nav aria-label="预览页面"><button data-page="home">首页</button><button data-page="browser">配方</button><button data-page="parameter">参数</button><button data-page="menu">设置</button><button data-page="review">回看</button><button data-page="keyboard">命名</button><button data-page="reset">确认框</button></nav>
<div class="screen"><img id="frame" alt="Recipe Lab 640×480 界面预览"><div id="busy" class="busy">正在编译预览…</div></div>
<div class="keys" aria-label="模拟机身按键">
<div class="pad"><span class="empty"></span><button data-key="up" aria-label="上">↑</button><span class="empty"></span><button data-key="left" aria-label="左">←</button><button data-key="enter" aria-label="中央确定">确定</button><button data-key="right" aria-label="右">→</button><span class="empty"></span><button data-key="down" aria-label="下">↓</button><span class="empty"></span></div>
<div class="side"><button data-key="wheel-">拨轮 −</button><button data-key="wheel+">拨轮 ＋</button><button data-key="fn">Fn</button><button data-key="play">相册</button><button data-key="zoom-">缩小</button><button data-key="zoom+">放大</button><button data-key="menu">MENU</button><button data-key="menu-hold">长按 MENU</button><button data-key="enter-hold">长按确定</button><button data-key="shutter">半按快门</button><button data-key="trash">隐藏面板</button></div>
</div>
<div class="lower"><span id="state" aria-live="polite"></span><label>语言<select id="language"><option value="1">简体中文</option><option value="0">English</option><option value="2">繁體中文</option></select></label><label>回看状态<select id="review-state"><option value="photo">照片占位</option><option value="loading">读取中</option><option value="empty">无照片</option><option value="error">接口不可用</option></select></label></div>
<p class="notice">改动代码后自动编译刷新，保留当前页面。这里不执行拍摄、相机参数写入或卡片操作；原生图像接口、性能及固件按键仍需实机验证。</p>
<pre id="error" role="alert" hidden></pre>
<script>
let revision=-1,commandChain=Promise.resolve(),available=false;
const frame=document.getElementById('frame'),busy=document.getElementById('busy'),build=document.getElementById('build'),error=document.getElementById('error');
async function refresh(){const r=await fetch('/state');if(!r.ok)return;const s=await r.json();frame.src='/frame.png?rev='+revision+'&t='+Date.now();try{await frame.decode();}catch{}document.getElementById('state').textContent=(s.page==='exited'?'应用已退出 · ':'')+s.recipe+' · '+(s.active?'已启用（模拟）':'预览');document.getElementById('language').value=s.lang;document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===s.page)));}
function send(key){commandChain=commandChain.catch(()=>{}).then(async()=>{if(!available)return;const r=await fetch('/command',{method:'POST',body:new URLSearchParams({key})});if(r.ok)await refresh();});return commandChain;}
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>send(b.dataset.key));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>send('page:'+b.dataset.page));document.getElementById('language').onchange=e=>send('lang:'+e.target.value);document.getElementById('review-state').onchange=e=>send('review:'+e.target.value);
document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'enter',Escape:'menu',p:'play',f:'fn','+':'zoom+','-':'zoom-'};if(keys[e.key]){e.preventDefault();send(keys[e.key]);}});
async function poll(){try{const s=await(await fetch('/status')).json();available=s.ready&&!s.building;busy.hidden=available;busy.textContent=s.error?'编译未通过，请查看下方信息':'正在更新预览…';error.hidden=!s.error;error.textContent=s.error;build.textContent=s.building?'正在更新…':s.error?'编译错误':'代码已同步 · '+s.revision;if(available&&revision!==s.revision){revision=s.revision;await refresh();}}catch{available=false;busy.hidden=false;busy.textContent='本地预览已停止';build.textContent='未连接';}setTimeout(poll,1000);}poll();
</script></body></html>
